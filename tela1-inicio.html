<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SuperLista - 1. Início</title>
    <!-- CDN Oficial do Bootstrap 5.3 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Conexão direta com o CSS da Tela 1 -->
    <link rel="stylesheet" href="tela1-inicio.css" />
  </head>
  <body>
    <!-- Menu de navegação padronizado com Bootstrap (nav-pills) -->
    <nav class="nav nav-pills menu-topo">
      <a class="nav-link active" href="tela1-inicio.html">1. Início</a>
      <a class="nav-link" href="tela2-compras.html">2. Lista de Compras</a>
      <a class="nav-link" href="tela3-orcamento.html">3. Calculadora de Gastos</a>
    </nav>

    <main class="container-app" id="painel-principal">
      <h1>🛒 SuperLista</h1>
      <p class="subtitulo">
        Organize suas compras de forma simples e interativa!
      </p>

      <!-- Campo de input padronizado com Input Group do Bootstrap -->
      <section class="bloco">
        <label for="input-nome" class="form-label">Seu nome:</label>
        <div class="input-group mb-2">
          <span class="input-group-text">👤</span>
          <input
            type="text"
            id="input-nome"
            class="form-control"
            placeholder="Digite seu nome..."
          />
          <button id="btn-salvar-nome" type="button" class="btn btn-primary">
            Salvar
          </button>
        </div>
        <p id="mensagem-boas-vindas" class="destaque-texto">
          Olá, Visitante! Configure suas categorias favoritas abaixo.
        </p>
      </section>

      <!-- Barra de Pesquisa + Adição de Categorias com Bootstrap -->
      <section class="bloco">
        <h2>Categorias da Feira</h2>

        <!-- Barra de pesquisar categorias (Input Group do Bootstrap) -->
        <div class="input-group input-group-sm mb-2">
          <span class="input-group-text">🔍</span>
          <input
            type="search"
            id="input-pesquisa-cat"
            class="form-control"
            placeholder="Pesquisar categoria..."
          />
        </div>

        <!-- Barra para adicionar nova categoria -->
        <div class="input-group mb-3">
          <input
            type="text"
            id="input-categoria"
            class="form-control"
            placeholder="Nova categoria (ex: Doces)"
          />
          <button id="btn-add-categoria" type="button" class="btn btn-primary">
            + Adicionar
          </button>
        </div>

        <ul id="lista-categorias" class="lista-tags"></ul>
      </section>

      <!-- Botões de ação padronizados com classes btn do Bootstrap -->
      <section class="bloco d-grid gap-2">
        <button id="btn-destaque" type="button" class="btn btn-outline-info">
          ✨ Alternar Borda Neon (Classe JS)
        </button>
        <a href="tela2-compras.html" class="btn btn-success">
          Ir para Lista de Compras →
        </a>
      </section>
    </main>

    <!-- Conexão direta com o arquivo JavaScript da Tela 1 -->
    <script src="tela1-inicio.js"></script>
  </body>
</html>
