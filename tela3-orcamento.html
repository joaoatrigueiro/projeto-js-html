<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SuperLista - 3. Calculadora de Gastos</title>
    <!-- CDN Oficial do Bootstrap 5.3 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Conexão direta com o CSS da Tela 3 -->
    <link rel="stylesheet" href="tela3-orcamento.css" />
  </head>
  <body>
    <!-- Menu de navegação padronizado com Bootstrap (nav-pills) -->
    <nav class="nav nav-pills menu-topo">
      <a class="nav-link" href="tela1-inicio.html">1. Início</a>
      <a class="nav-link" href="tela2-compras.html">2. Lista de Compras</a>
      <a class="nav-link active" href="tela3-orcamento.html">3. Calculadora de Gastos</a>
    </nav>

    <main class="container-app">
      <h1>💰 Calculadora de Gastos</h1>
      <p class="subtitulo">
        Defina seu limite e registre os preços para não estourar o orçamento!
      </p>

      <!-- Input para definir o limite de orçamento com Input Group do Bootstrap -->
      <section class="mb-3">
        <label for="input-limite" class="form-label">Limite de gasto:</label>
        <div class="input-group">
          <span class="input-group-text">R$</span>
          <input
            type="number"
            id="input-limite"
            class="form-control"
            value="100"
            min="1"
          />
          <button id="btn-definir-limite" type="button" class="btn btn-primary">
            Atualizar Meta
          </button>
        </div>
      </section>

      <!-- Painel que recebe classe CSS dinâmica pelo JS (verde ou vermelho) -->
      <section id="painel-status" class="painel-resumo saldo-ok">
        <p>Meta: <strong id="texto-limite">R$ 100,00</strong></p>
        <p>Total Gasto: <strong id="texto-total">R$ 0,00</strong></p>
        <p id="mensagem-status" class="mb-0">Dentro do orçamento! 🎉</p>
      </section>

      <!-- Barra de Pesquisa de Gastos com Bootstrap -->
      <div class="input-group input-group-sm mb-2">
        <span class="input-group-text">🔍</span>
        <input
          type="search"
          id="input-pesquisa-gasto"
          class="form-control"
          placeholder="Pesquisar gasto lançado..."
        />
      </div>

      <!-- Inputs para adicionar novo gasto no Array em memória (Input Group Bootstrap) -->
      <div class="input-group mb-3">
        <input
          type="text"
          id="input-nome-gasto"
          class="form-control"
          placeholder="Produto (ex: Leite)"
        />
        <span class="input-group-text">R$</span>
        <input
          type="number"
          id="input-valor-gasto"
          class="form-control input-valor-curto"
          placeholder="0,00"
          step="0.50"
        />
        <button id="btn-add-gasto" type="button" class="btn btn-success">
          + Somar
        </button>
      </div>

      <!-- Lista de gastos renderizada pelo Array -->
      <ul id="ul-gastos" class="lista-gastos"></ul>

      <div class="d-grid">
        <a href="tela1-inicio.html" class="btn btn-outline-secondary">
          ← Voltar para o Início
        </a>
      </div>
    </main>

    <!-- Conexão direta com o arquivo JavaScript da Tela 3 -->
    <script src="tela3-orcamento.js"></script>
  </body>
</html>
